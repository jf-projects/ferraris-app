name: Supabase DB Backup

on:
  schedule:
    - cron: "0 2 * * *"   # Runs daily at 2AM UTC
  workflow_dispatch:      # Allows manual run

jobs:
  backup:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install PostgreSQL client
        run: sudo apt-get install -y postgresql-client

      - name: Create DB dump
        run: |
          pg_dump "${{ secrets.SUPABASE_DB_URL }}" > backup.sql

      - name: Compress backup
        run: |
          tar -czf backup.tar.gz backup.sql

      - name: Send Email with Attachment
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 587
          username: ${{ secrets.GMAIL_USER }}
          password: ${{ secrets.GMAIL_APP_PASSWORD }}
          subject: Supabase DB Backup
          body: Attached is your latest Supabase database backup.
          to: ${{ secrets.EMAIL_TO }}
          from: ${{ secrets.GMAIL_USER }}
          attachments: backup.tar.gz